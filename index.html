<style>
/* Layout: single left-aligned column on a faint grid. Home = hero, about, CV, project grid. Project = generative header, text, media tiles. */
:root {
  --bg: #000000;
  --fg: #cfd8da;
  --dim: #8a979a;
  --line: #172022;
  --accent: #4df0ff;
  --accent-dim: rgba(77, 240, 255, 0.14);
  --font-display: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-mono);
  font-size: 16px;
  line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 64px 64px;
  background-position: -1px -1px;
}
.wrap { max-width: 1180px; margin: 0 auto; }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
::selection { background: var(--accent); color: #000; }

/* nav */
.nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: rgba(0,0,0,0.88); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
}
.nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 52px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.02em; font-size: 17px; cursor: pointer; background: none; border: 0; color: var(--fg); padding: 0; }
.brand i { color: var(--accent); font-style: normal; }
.links { display: flex; gap: 28px; }
.links button { background: none; border: 0; color: var(--fg); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; padding: 6px 0; }
.links button:hover { color: var(--accent); }


/* sections */
section { padding-block: 88px 0; }
.label { font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin: 0 0 28px; display: flex; align-items: center; gap: 12px; }
.label::after { content: ""; height: 1px; flex: 1; background: var(--line); }

/* hero */
.hero { padding-block: 0; }
.intro { margin: 0 0 28px; color: var(--dim); font-size: 17px; }
.intro b { color: var(--fg); font-weight: 600; }
.hero .status { color: var(--dim); font-size: 13px; letter-spacing: 0.1em; margin: 0 0 20px; }
.hero .status b { color: var(--accent); font-weight: 400; }
h1 { font-family: var(--font-display); font-weight: 300; font-size: clamp(44px, 9vw, 104px); line-height: 0.98; letter-spacing: 0.02em; text-transform: uppercase; margin: 0; text-wrap: balance; }
h1 span { color: var(--accent); }
.cursor { display: inline-block; width: 0.5em; height: 0.09em; background: var(--accent); margin-left: 0.15em; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.role { margin: 28px 0 0; color: var(--dim); font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; }
.role em { color: var(--fg); font-style: normal; }
.hero-links { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; }
.btn { border: 1px solid var(--line); padding: 8px 16px; font-size: 13px; letter-spacing: 0.08em; color: var(--fg); background: none; font-family: var(--font-mono); cursor: pointer; transition: border-color .2s, color .2s; }
.btn:hover { border-color: var(--accent); color: var(--accent); }

/* about */
.about { display: grid; grid-template-columns: 1fr 1fr; gap: 40px 64px; }
.about p { margin: 0; max-width: 62ch; }
.about h3 { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); margin: 0 0 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.chip { border: 1px solid var(--line); padding: 2px 10px; font-size: 12px; color: var(--dim); letter-spacing: 0.04em; }

/* cv */
.cv { display: grid; grid-template-columns: 1fr 1fr; gap: 48px 64px; }
.cv h3 { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); margin: 0 0 16px; }
.row { display: grid; grid-template-columns: 112px 1fr; gap: 16px; padding-block: 10px; border-top: 1px solid var(--line); }
.row:last-child { border-bottom: 1px solid var(--line); }
.row .when { color: var(--dim); font-size: 12px; letter-spacing: 0.04em; padding-top: 3px; font-variant-numeric: tabular-nums; }
.row .what { min-width: 0; }
.row .what b { display: block; font-weight: 400; color: var(--fg); }
.row .what span { color: var(--dim); font-size: 13px; }
.row .what .hl { color: var(--accent); }
.skills { margin-top: 20px; font-size: 13px; color: var(--dim); }
.skills b { color: var(--fg); font-weight: 400; }
.cv-note { margin-top: 28px; font-size: 13px; color: var(--dim); }
.cv-note a { color: var(--accent); border-bottom: 1px solid var(--accent-dim); }

/* project grid */
.home { max-width: 960px; margin: 0 auto; padding: 72px clamp(0px, 3vw, 40px) 96px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
.links button.on { color: var(--accent); }
.pg { padding-block: 56px 0; }
.card { display: flex; flex-direction: column; gap: 14px; cursor: pointer; text-align: left; background: none; border: 0; padding: 0; color: inherit; font: inherit; min-width: 0; }
.thumb { position: relative; aspect-ratio: 16 / 10; max-width: 100%; border: 1px solid var(--line); background: #000; overflow: hidden; transition: border-color .25s; }
.card.wide { grid-column: 2; }
.slides { position: absolute; inset: 0; background: #000; }
.slides img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; animation: slide 16s linear infinite both; will-change: opacity, transform; }
@keyframes slide { 0% { opacity: 0; transform: scale(1); } 6% { opacity: 1; } 25% { opacity: 1; } 31% { opacity: 0; transform: scale(1.09); } 100% { opacity: 0; transform: scale(1.09); } }
.thumb canvas, .thumb video, .thumb img.m { width: 100%; height: 100%; display: block; object-fit: cover; }
.thumb .cap { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 56px 18px 16px; background: linear-gradient(transparent, rgba(0,0,0,0.88)); }
.thumb .cap .meta { display: block; margin-bottom: 4px; }
.thumb .cap h3 { font-size: clamp(14px, 1.5vw, 19px); color: #fff; }
.thumb::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.0) 0, rgba(0,0,0,0.0) 2px, rgba(0,0,0,0.22) 3px); pointer-events: none; }
.card:hover .thumb, .card:focus-visible .thumb { border-color: var(--accent); }
.card .idx { display: none; }
.card h3 { font-family: var(--font-display); font-weight: 700; margin: 0; line-height: 1.2; letter-spacing: -0.01em; }
.card:hover h3 { color: var(--accent); }
.card .thumb { transition: border-color .25s, transform .35s; }
.card:hover .thumb { transform: translateY(-3px); }
.card p { margin: 0; font-size: 15px; color: var(--dim); line-height: 1.6; }
.card .meta { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }

/* project page */
.back { margin-top: 36px; background: none; border: 0; color: var(--dim); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; padding: 6px 0; }
.back:hover { color: var(--accent); }
.p-head { aspect-ratio: 21 / 9; width: 100%; max-width: 100%; border: 1px solid var(--line); margin-top: 20px; position: relative; overflow: hidden; }
.p-head canvas { width: 100%; height: 100%; display: block; }
.p-head video, .p-head img.m { width: 100%; height: 100%; display: block; object-fit: cover; }
.p-head::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,0.22) 3px); pointer-events: none; }
.p-title { margin: 40px 0 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(32px, 5.5vw, 60px); line-height: 1.08; letter-spacing: -0.01em; text-wrap: balance; }
.p-meta { display: flex; flex-wrap: wrap; gap: 8px 32px; margin: 20px 0 0; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); }
.p-meta b { color: var(--accent); font-weight: 400; }
.p-body { display: grid; grid-template-columns: 1.4fr 1fr; gap: 40px 64px; margin-top: 40px; }
.p-body p { margin: 0 0 16px; max-width: 62ch; }
.p-body h3 { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); margin: 0 0 12px; }
.media { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
.tile { display: flex; flex-direction: column; border: 1px solid var(--line); background: rgba(0,0,0,0.7); transition: border-color .25s; min-width: 0; }
.tile:hover, .tile:focus-visible { border-color: var(--accent); }
.tile .poster { aspect-ratio: 16 / 9; display: grid; place-items: center; border-bottom: 1px solid var(--line); position: relative; overflow: hidden; background: #000; }
.tile .poster img.m { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }
.tile .poster canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.55; }
.tile .play { position: relative; width: 54px; height: 54px; border: 1px solid var(--accent); border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,0.6); }
.tile .play::before { content: ""; border-left: 14px solid var(--accent); border-top: 9px solid transparent; border-bottom: 9px solid transparent; margin-left: 4px; }
.tile .glyph { position: relative; font-family: var(--font-display); font-size: 28px; letter-spacing: 0.1em; color: var(--accent); }
.tile .cap { padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.tile .cap small { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
.tile .cap span { font-size: 14px; }
.tile .cap em { font-style: normal; font-size: 12px; color: var(--dim); }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 20px; }
.photos img { width: 100%; display: block; border: 1px solid var(--line); aspect-ratio: 16 / 9; object-fit: cover; }
.photos.natural { align-items: start; }
.photos.natural img { aspect-ratio: auto; object-fit: contain; }
.photos img.wide { grid-column: 1 / -1; aspect-ratio: auto; object-fit: contain; }
.pager { display: flex; justify-content: space-between; gap: 16px; margin-top: 72px; border-top: 1px solid var(--line); padding-top: 20px; flex-wrap: wrap; }
.pager button { background: none; border: 0; color: var(--dim); font: inherit; font-size: 13px; letter-spacing: 0.06em; cursor: pointer; text-align: left; padding: 4px 0; max-width: 100%; }
.pager button:hover { color: var(--accent); }
.pager small { display: block; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }

/* contact + footer */
.contact { display: flex; flex-direction: column; gap: 6px; font-size: 16px; }
.contact a { color: var(--fg); width: fit-content; border-bottom: 1px solid var(--line); }
.contact a:hover { color: var(--accent); border-color: var(--accent); }
.copy { background: none; border: 1px solid var(--line); color: var(--dim); font: inherit; font-size: 12px; padding: 0 8px; margin-left: 10px; cursor: pointer; }
.copy:hover { color: var(--accent); border-color: var(--accent); }
.mail { display: flex; align-items: center; flex-wrap: wrap; row-gap: 6px; }
footer { margin-top: 96px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 12px; color: var(--dim); letter-spacing: 0.08em; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

@media (max-width: 860px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .home { padding-top: 40px; }
  .thumb .cap { padding: 40px 12px 12px; }
  .card.wide { grid-column: 1 / -1; width: calc(50% - 8px); justify-self: center; }
  .about, .cv, .p-body { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .grid { grid-template-columns: 1fr; }
  .row { grid-template-columns: 1fr; gap: 0; }
  .hero { padding-block: 28px 0; }
  section { padding-block: 56px 0; }
  .links { gap: 12px; }
  .p-head { aspect-ratio: 16 / 10; }
}
@media (prefers-reduced-motion: reduce) {
  .slides img { animation: none; opacity: 0; }
  .slides img:first-child { opacity: 1; }
  html { scroll-behavior: auto; }
  .cursor { animation: none; }
}
</style>

</head>

  function go(target) {
    var h = PAGES[target] ? target : "";
    if ((location.hash || "").replace("#", "") === h) render(); else location.hash = h;
  }
  document.addEventListener("click", function (e) {
    var o = e.target.closest("[data-open]"), g = e.target.closest("[data-go]");
    if (o) { location.hash = o.getAttribute("data-open"); }
    else if (g) { go(g.getAttribute("data-go")); }
  });
  window.addEventListener("hashchange", render);
  render();
})();
</script>

</body>
</html>
